name: Sync Package Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    name: Create release on tallcms/cms

    steps:
      - name: Wait for package split to complete
        run: sleep 30

      - name: Create release on package repo
        shell: bash
        run: |
          args=(release create "$TAG_NAME" --repo tallcms/cms --verify-tag --title "$RELEASE_NAME" --notes "$RELEASE_BODY")

          if [[ "$IS_PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi

          gh "${args[@]}"
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_SPLIT_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
